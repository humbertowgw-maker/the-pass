name: Deploy Brigade API to Azure Function App

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - ".github/workflows/azure-functions-the-pass-api.yml"
  workflow_dispatch: {}

jobs:
  build_and_deploy:
    if: github.repository == 'humbertowgw-maker/the-pass'
    runs-on: ubuntu-latest
    name: Build and Deploy Function App
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test api/**/*.test.js
      - uses: Azure/functions-action@v1
        with:
          app-name: the-pass-api
          package: api
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
