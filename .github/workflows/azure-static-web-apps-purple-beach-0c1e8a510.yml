name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy_job:
    if: github.repository == 'humbertowgw-maker/the-pass' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed'))
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_BRIGADE_TIP_URL: ${{ secrets.VITE_BRIGADE_TIP_URL }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_BEACH_0C1E8A510 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          # TEMPORARILY reverted to managed functions (2026-09-20). Attempted
          # migrating to a standalone Function App (the-pass-api, see
          # azure-functions-the-pass-api.yml) to escape managed functions'
          # ~45s ceiling, but that plan's Consumption SKU got stuck
          # provisioning in two regions, and Flex Consumption (which did
          # come up) doesn't support publish-profile deployment at all --
          # needs OIDC/service-principal auth instead, not yet set up.
          # Reverting to the known-imperfect-but-partially-working managed
          # setup rather than leaving this at 0% success. Pick back up:
          # finish azure/login OIDC for the functions-action workflow, then
          # remove this api_location line again.
          api_location: "api" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.repository == 'humbertowgw-maker/the-pass' && github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_BEACH_0C1E8A510 }}
          action: "close"
